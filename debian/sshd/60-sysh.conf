# sysh agent channel (§5.3).
#
# This drop-in binds the sy user to the sysh policy files and locks the
# agent channel down to exactly what the gateway needs. The trailing
# `Match all` terminates the block so nothing below this file can leak
# into it (drop-ins concatenate in lexical order).
#
# There is no ForceCommand: the sy account's login shell IS the gateway
# (sshd invokes it as `sysh -c '<command>'`), and sshd refuses to run a
# command through a shell that is not a real shell — /usr/bin/sysh is
# registered in /etc/shells for exactly that reason.
#
# Every exec request reaches the shell this way, including what scp and
# rsync send, and external subsystems too (the Debian/Ubuntu sftp-server
# binary arrives here as `sysh -c '/usr/lib/openssh/sftp-server'`).
# internal-sftp would bypass the shell (it runs inside sshd) and cannot
# be restricted per-Match — `sysh doctor` detects and warns about it.
Match user sy
    AuthorizedKeysFile /etc/sysh/authorized_keys
    AuthenticationMethods publickey
    ExposeAuthInfo yes
    PermitTTY no
    DisableForwarding yes
    X11Forwarding no
    AllowAgentForwarding no
    PermitTunnel no
    PermitUserRC no
    AllowTcpForwarding no
    PermitListen none
    PermitOpen none
    MaxSessions 2

Match all
