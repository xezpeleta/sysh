# sysh volatile state (§4.5) — recreated at boot by systemd-tmpfiles.
# /run is tmpfs: everything here is deliberately volatile.
#
# requests is the phase-2 approval drop box (root:sy 0730: sy may drop
# files in, cannot list or read anything back).
# results is root:sy 0750: sy may read result files, not create them.
# tripwire is 1777: any local user may plant the lockdown flag; only
# root may clear it.
d  /run/sysh             0755 root root -
d  /run/sysh/requests    0730 root sy   -
d  /run/sysh/results     0750 root sy   -
d  /run/sysh-tripwire    1777 root root -
