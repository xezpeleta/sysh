# sysh example policy (§7). Install with:
#   sysh policy install < policy.example.toml
#
# argv is the unit of trust: rules match exact argv length unless a
# `rest` pattern is given. A position containing \ | ( ) [ ] { } * + ?
# is a restricted RE2 pattern (anchored); everything else is a literal.

version = 2
host = "example-host"
mode = "enforcing"          # enforcing | permissive (permissive: auditd mandatory)

# --- the canonical allow: read-only service status
[[rule]]
argv = ["/usr/bin/systemctl", "status", "[a-z0-9@._][a-z0-9@._\\-]*"]
path = "/usr/bin/systemctl"
timeout = 30

[[rule]]
argv = ["/usr/bin/systemctl", "is-active", "[a-z0-9@._][a-z0-9@._\\-]*"]
path = "/usr/bin/systemctl"
timeout = 15

[[rule]]
argv = ["/usr/bin/systemctl", "list-units"]
path = "/usr/bin/systemctl"
timeout = 30

# --- logs (opt-in rest pattern; note the two-position form that can
# never match a leading '-')
[[rule]]
argv = ["/usr/bin/journalctl", "-u"]
path = "/usr/bin/journalctl"
rest = "[a-z0-9@._][a-z0-9@._\\-]*"
timeout = 60

[[rule]]
argv = ["/usr/bin/journalctl", "--disk-usage"]
path = "/usr/bin/journalctl"
timeout = 30

# --- disk / process inspection
[[rule]]
argv = ["/usr/bin/df", "-h"]
path = "/usr/bin/df"
timeout = 15

[[rule]]
argv = ["/usr/bin/free", "-h"]
path = "/usr/bin/free"
timeout = 15

[[rule]]
argv = ["/bin/ps", "aux"]
path = "/bin/ps"
timeout = 15

# --- misc read-only tooling
[[rule]]
argv = ["/usr/bin/uptime"]
path = "/usr/bin/uptime"
timeout = 15

[[rule]]
argv = ["/usr/sbin/dmesg", "-T"]
path = "/usr/sbin/dmesg"
timeout = 30

# --- file writers / network tools need an explicit ack (warning class)
[[rule]]
argv = ["/usr/bin/curl", "-fsSL"]
path = "/usr/bin/curl"
rest = "https://[a-z0-9][a-z0-9./_\\-]*"
timeout = 60
ack = true                   # acknowledged: curl writes files / opens connections

# --- deny rules: prefix semantics, checked before every allow
[[rule]]
argv = ["find"]
deny = true

[[rule]]
argv = ["/usr/bin/systemctl", "--user"]
deny = true                  # user-unit persistence

# --- privileged rules (phase 1.5): execute as root via an exact-argv
# sudoers grant that `sysh policy install` generates and validates with
# visudo. Guardrails enforced by the linter: ack = true, an explicit
# timeout, no rest, no whitespace inside argv elements (sudoers grants
# match exact argv strings). Trade-off: while such a policy is
# installed the gateway runs WITHOUT NoNewPrivs, so the linter also
# rejects setuid binaries on non-privileged allow rules.
# [[rule]]
# argv = ["/usr/bin/systemctl", "restart", "nginx"]
# path = "/usr/bin/systemctl"
# privileged = true
# ack = true
# timeout = 30

# --- approval rules (phase 2): root, but only after a human answers a
# per-exec request. The gateway drops the request (exit 30); the
# operator sees the exact argv with `sysh approvals` and runs
# `sysh approve <id>` — typing any pattern-chosen argument by hand —
# from any root SSH session; the agent fetches the outcome read-only
# with `sysh-result <id>` (exit 31 while pending/absent). No standing
# sudoers grant exists for these; patterns are allowed because the
# human re-checks what matched.
# [[rule]]
# argv = ["/usr/bin/systemctl", "restart", "[a-z0-9@._][a-z0-9@._\\-]*"]
# path = "/usr/bin/systemctl"
# privileged = true
# approval = true
# timeout = 30
